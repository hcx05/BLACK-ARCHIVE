[program:sshd]
command=/usr/sbin/sshd -D
autorestart=true

[program:cron]
command=/usr/sbin/cron -f
autorestart=true

[program:mariadb]
command=/opt/relay/scripts/run-mariadb.sh
autorestart=true
startretries=3

[program:ledger-api]
command=node /opt/relay/api/server.js
user=www-data
autorestart=true
