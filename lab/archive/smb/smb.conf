[global]
   workgroup = OCPA
   server string = CAIRN Records File Server
   security = user
   map to guest = Bad User
   log file = /var/log/samba/%m.log
   max log size = 50

   # Intentionally weak: allow SMBv1
   server min protocol = NT1

[public]
   path = /srv/share/public
   browsable = yes
   writable = yes
   guest ok = yes
   read only = no
   create mask = 0777
   directory mask = 0777

[confidential]
   path = /srv/share/confidential
   browsable = yes
   writable = no
   guest ok = no
   valid users = sysadmin
   # Misconfiguration: world-readable despite requiring auth
   create mask = 0644

[backups]
   path = /srv/share/backups
   browsable = yes
   writable = yes
   guest ok = yes
   read only = no
