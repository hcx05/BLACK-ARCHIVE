server {
    listen 80 default_server;
    root /var/www/html/portal;
    index index.php index.html;

    # Directory listing enabled (information disclosure)
    location /uploads/ {
        autoindex on;
    }

    # Directory listing left on for the notes share (should have been
    # behind the app layer only, not served directly by nginx)
    location /notes/ {
        autoindex on;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    # Expose server status (information disclosure)
    location /server-status {
        stub_status on;
    }
}
